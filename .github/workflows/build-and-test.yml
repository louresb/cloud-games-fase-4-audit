name: .NET CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'chore/**']
    paths-ignore:
      - 'k8s/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore ./Fiap.CloudGames.Audit.sln
      - run: dotnet build ./Fiap.CloudGames.Audit.sln -c Release --no-restore
      - run: dotnet test ./Fiap.CloudGames.Audit.sln -c Release --no-build --logger "trx;LogFileName=test_results.trx" --collect "XPlat Code Coverage"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          if-no-files-found: ignore
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/coverage.cobertura.xml
