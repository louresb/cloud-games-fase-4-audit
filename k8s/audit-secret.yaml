# Template only. In production use ExternalSecret pulling from AWS Secrets Manager (see orchestration repo).
# kubectl create secret generic audit-secret --from-literal=... --namespace fcg-apps
apiVersion: v1
kind: Secret
metadata:
  name: audit-secret
  namespace: fcg-apps
  labels:
    app: audit-svc
    part-of: fiap-cloud-games
type: Opaque
stringData:
  RabbitMq__UserName: "guest"
  RabbitMq__Password: "guest"
  # When deploying to AWS with IRSA, leave AccessKey/SecretKey empty — pod role will be used.
  AWS__AccessKey: ""
  AWS__SecretKey: ""
